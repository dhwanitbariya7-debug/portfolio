    <meta
      name="description"
      content="Personal academic and engineering portfolio dashboard for Dhwanit Bariya, First-Year CSE (AI & ML) undergraduate at Karnavati University. Features verified LinkedIn Learning and PMI credentials, the interactive Morse Buddy Arduino hardware workbench, and C programming foundations."

    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dhwanit.portfolio.theme');
          if (saved !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
